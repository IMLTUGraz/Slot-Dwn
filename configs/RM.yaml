num_relations: 1    # number of relations in the RM problems: 1 | 2 | 3
num_obj: 9          # actual number of objects: K'
seed: 42    # used only for deterministic slot attention. any arbitrary seed will work.

# ---- slot attention encoder (frozen, pretrained) path ----
slot_ae:
  ckpt: RM/sae_checkpoints/enc64-dec8-k11-aug-final.pth.tar

data:
  train_path: '$SCRATCH/deepiq_g_train'
  test_path: '$SCRATCH/deepiq_g_test'
  transfer_path: '$SCRATCH/deepiq_s_set'
  num_workers: 4

# ---- DWN reasoner ----
dwn:
  dwn_heads: 4
  dwn_hid: 2048
  dwn_num_layers: 2
  dwn_levels: 5
  tau: 0.07
  n: 4
  mapping_type: paired
  lm_tau: 0.001
  first_layer_heads: 2
  use_subset_lm: true
  subset_lm_mode: strided
  pool_size: 100

# ---- optimization ----
optim:
  batch_size: 16
  learning_rate: 0.01
  min_lr: 0.000001
  num_epochs: 100

train:
  device: 0
  no_cuda: false
  log_interval: 10
  eval_interval: 5

ckpt_dir: RM/slot_dwn_rm/
